<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
        Rules for id selector - using # before the id name in css file and applying it to the same tag in html file
        #idname{

        } */

        #movie{
            color: rgb(255, 200, 0);
            background-color: rgb(200, 122, 166);
            text-align: center;
            font-family : cursive;
        }

        #shop{
            color: blue;
            background-color: lightgray;
            text-align: center;
            text-decoration: underline;
        }

        #login{
            color: white;
            background-color: rgb(239, 148, 11);
            font-weight: bold;
        }

        #pay{
            color: white;
            background-color: rgb(8, 195, 155);
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Same Tag Different Style - using id selector in css file and applying it to the same tag in html file -->

    <h2 id="movie">Netflix</h2>

    <h2 id="shop">Amazon</h2>

    <button id="login">Login</button>

    <button id="pay">Pay Now</button>
</body>
</html>
