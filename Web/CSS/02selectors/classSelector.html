<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
        Rules for class selector - using . before the class name in css file and applying it to different tag in html file
        .classname{

        } */

        .abc{
            color: rgb(255, 200, 0);
            
        }

        .xyz{
            color: blue;
           
        }
    </style>
</head>
<body>
    <!-- Different Tag/Multiple Tags Same Style - using class selector in css file and applying it to different tag in html file -->
     <h2 class="abc">Welcome</h2>
     <h3 class="abc">Hello Guys</h3>
     <p class="xyz">This is paragraph</p>
     <button class="abc">Click Me</button> <br> <br>
     <em class="xyz">This is Italic Text</em>
     <h2 class="xyz">Thank You</h2>
</body>
</html>
