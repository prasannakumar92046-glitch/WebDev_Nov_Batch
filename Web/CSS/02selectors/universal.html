<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
        Rules for Universal selector - using * in css file and applying it to all tags in html file
        *{

        } 
        */

        *{
            color: rgb(46, 14, 205);
            background-color: rgb(13, 236, 176);
            
        }
        #shop{
            color: rgb(208, 87, 160);
            background-color: lightgray;
           
        }

    </style>
</head>
<body>
    <h2 class="abc">Welcome</h2>

    <h3 >Hello Guys</h3>

    <p class="xyz">This is paragraph</p>

    <h2 id="shop">Amazon</h2>

    <button id="login">Login</button>

</body>
</html>
