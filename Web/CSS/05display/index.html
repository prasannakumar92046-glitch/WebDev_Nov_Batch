<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        .products{
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            align-items: center;
            flex-wrap:wrap;

            height: 100vh;
            background-color: #eee;
        }
        .box{
            color: #be0606;
            width: 100px;
            height: 100px;
            background-color: #ccc;
            border: 1px solid #5607d5;
        }
    </style>
</head>
<body>
    <div class="products"> 
        <div class="box">cake</div>
        <div class="box">pie</div>
        <div class="box">cookie</div>
        
    </div>
</body>
</html>
