<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- inline css style - in the same tag using style as attribute -->
     <h2 style="color: blue; background-color: lightgray; text-align: center;">Welcome To CSS</h2>

     <p>This is  an example of inline CSS styling.</p>

     <p style="color: red; font-weight: bold; text-align: end;">This is Second Paragraph</p>
</body>
</html>
