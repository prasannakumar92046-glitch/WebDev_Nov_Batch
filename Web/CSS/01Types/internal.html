<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            color: blue;
            background-color: lightgray;
            text-align: center;
            text-decoration: underline;
            font-family : cursive;
        }

        button{
            color: white;
            background-color: rgb(8, 195, 155);
            font-weight: bold;
            text-align: center;
        }

        p{
            color: red;
            font-weight: bold;
            text-align: center;
        }


    </style>
</head>
<body>
    <!-- Internal CSS style - Inside HTML under the Head tag using style as tag -->
    <!-- for small projects, internal CSS is a good option. It is used when a single HTML document has a unique style. Internal CSS is defined in the head section of an HTML page, inside a <style> element. It is useful when you want to apply styles to a single page, rather than across multiple pages. However, it can make the HTML file larger and harder to maintain if there are many styles defined within the same file. -->
    <h2>Welcome To Internal CSS</h2>
    <button>Login</button>
    <button>Sign Up</button>
    <p>This is an example of Internal CSS styling.</p>
</body>
</html>
